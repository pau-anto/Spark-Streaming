producer {
  source.dir      = "data/Test/*"
  source.dir      = ${?SOURCE_DIR}
  destination.dir = "dest"

  # Réglages à faire varier pour les tests de performance.
  # Chaque réglage peut être surchargé par une variable d'environnement
  # (utilisé par sweep.py), sans modifier ce fichier.
  #
  # flux envoyé = batch.size / (interval.ms / 1000) images par seconde
  # (cadence fixe : interval.ms = période entre le DÉBUT de deux batchs)
  batch.size  = 5
  batch.size  = ${?BATCH_SIZE}

  interval.ms = 2000
  interval.ms = ${?INTERVAL_MS}

  # Nombre de copies simultanées (partitions Spark + threads local[p])
  parallelism = 4
  parallelism = ${?PARALLELISM}

  # Identifiant du test, préfixe des fichiers dans dest/ : <run.id>__<classe>_<fichier>.jpg
  # Ne doit pas contenir "__" (séparateur lu par le Consumer)
  run.id = "manuel"
  run.id = ${?RUN_ID}

  delete.source = false
  overwrite     = true
}