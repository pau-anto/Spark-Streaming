consumer {
  # Parallélisme Spark : "local[*]" = tous les cœurs, "local[4]" = 4 tâches en parallèle
  master = "local[*]"

  # "train"   : phase 1, écrit features + labels pour le service ML
  # "predict" : phase 2, charge le modèle ONNX et écrit les prédictions
  mode = "predict"

  # !!! Doit être identique à producer.destination.dir !!!
  input.dir = "dest"

  # Nombre d'images max par micro-batch (à aligner sur producer.batch.size)
  max.files.per.trigger = 5

  train {
    output.dir     = "output/train"
    checkpoint.dir = "checkpoint/consumer-train"
  }

  predict {
    output.dir     = "output/predictions"
    checkpoint.dir = "checkpoint/consumer-predict"
    model.path     = "ml-service/model/model.onnx"
  }

  perf {
    # statistiques : une ligne tous les 100 images + une ligne "total" à la fin
    csv = "output/perf.csv"

    # détail : une ligne par image
    images.csv = "output/perf_images.csv"

    # config du producer, relue pour noter batch.size et interval.ms dans les CSV
    producer.conf = "producer/src/main/resources/application.conf"
  }
}